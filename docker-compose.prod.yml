# ---------------------------------------------------------------------------
# The Record — production override
# Usage:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file ONLY applies deltas to docker-compose.yml:
#   - Strips all bind-mount volumes (no source mounting in prod).
#   - Forces NODE_ENV=production for Node services.
#   - Adds restart: unless-stopped to every container.
#   - Drops port exposures except 127.0.0.1:3090:3000 for web
#     (nginx on the host proxies the public domain to that port).
#
# Requires: Docker Compose >= 2.20 (for the !override YAML tag).
# ---------------------------------------------------------------------------

services:
  # --------------------------------------------------------------------- db
  postgres:
    restart: unless-stopped
    ports: !override []

  # -------------------------------------------------------------------- api
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      OTEL_SERVICE_NAME: therecord-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${NESTJS_PORT:-3091}
      INTELLIGENCE_URL: ${INTELLIGENCE_URL:-http://intelligence:8001}
      INTELLIGENCE_TIMEOUT_MS: ${INTELLIGENCE_TIMEOUT_MS:-30000}
      INGESTION_ENABLED: ${INGESTION_ENABLED:-false}
      INGESTION_API_KEY: ${INGESTION_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NEWSLETTER_FROM_EMAIL: ${NEWSLETTER_FROM_EMAIL:-newsletter@therecord.co.za}
      NEWSLETTER_FROM_NAME: ${NEWSLETTER_FROM_NAME:-The Record}
      NEWSLETTER_WEB_URL: ${NEWSLETTER_WEB_URL:-https://therecord.co.za}
      NEWSLETTER_ENABLED: ${NEWSLETTER_ENABLED:-false}
      SIU_AGENT_ENABLED: ${SIU_AGENT_ENABLED:-false}
      SAFLII_AGENT_ENABLED: ${SAFLII_AGENT_ENABLED:-false}
    ports: !override []
    volumes: !override []

  # ----------------------------------------------------------- intelligence
  intelligence:
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: prod
      ENVIRONMENT: production
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      RELEVANCE_STRATEGY: ${RELEVANCE_STRATEGY:-centroid}
      RELEVANCE_MODEL_PATH: ${RELEVANCE_MODEL_PATH:-}
      SIU_AGENT_ENABLED: ${SIU_AGENT_ENABLED:-false}
      SAFLII_AGENT_ENABLED: ${SAFLII_AGENT_ENABLED:-false}
      AGENT_MIN_RELEVANCE: ${AGENT_MIN_RELEVANCE:-0.4}
    ports: !override []
    volumes: !override []

  # -------------------------------------------------------------------- web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3091
        # Baked into client bundles at build time (search, Ask, People grid).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://therecord.co.za/api}
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_BUILD_SHA: ${NEXT_PUBLIC_BUILD_SHA:-}
        NEXT_PUBLIC_BUILD_DATE: ${NEXT_PUBLIC_BUILD_DATE:-}
        NEXT_PUBLIC_BUILD_MESSAGE: ${NEXT_PUBLIC_BUILD_MESSAGE:-}
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side fetches stay on the docker network (therecord-api).
      API_URL: http://api:3091
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://therecord.codist.co.za/api}
      INGESTION_API_KEY: ${INGESTION_API_KEY:-}
      NEXT_TELEMETRY_DISABLED: "1"
    ports: !override
      - "127.0.0.1:3090:3000"
    volumes: !override []

  # ------------------------------------------------------------------ umami
  umami:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3095:3000"

  umami-db:
    restart: unless-stopped
    ports: !override []
